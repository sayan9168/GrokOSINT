name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Ruff lint (soft)
        run: ruff check grok_osint web_app.py main.py --ignore E501,E402 || true
      - name: Tests
        run: |
          python -c "import grok_osint; print(grok_osint.__version__)"
          pytest tests/ -q --tb=short
      - name: Flask health smoke
        run: |
          python -c "import web_app; c=web_app.app.test_client(); r=c.get('/api/health'); print(r.status_code); assert r.status_code==200"
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t grokosint:ci .
