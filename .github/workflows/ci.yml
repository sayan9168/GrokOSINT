name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install flask httpx pyyaml dnspython phonenumbers pytest
          pip install -r requirements.txt || true

      - name: Version
        run: python -c "import grok_osint; print(grok_osint.__version__)"

      - name: Pytest
        run: pytest tests/ -q --tb=short

      - name: Health
        run: |
          python -c "
          import web_app
          c = web_app.app.test_client()
          r = c.get('/api/health')
          print(r.status_code, r.data)
          assert r.status_code == 200
          "
