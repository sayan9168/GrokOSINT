services:
  grokosint:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - ./reports:/app/reports
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install -q -r requirements.txt &&
               pip install -q holehe maigret 2>/dev/null || true &&
               python web_app.py"
    restart: unless-stopped
